name: mikos

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mikos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mikos}
      POSTGRES_DB: mikos
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mikos -d mikos"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://mikos:${POSTGRES_PASSWORD:-mikos}@db:5432/mikos
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN:-}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD:-}
      MIKOS_ALLOWED_EMAILS: ${MIKOS_ALLOWED_EMAILS:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://mmaly.cz,http://localhost:5173}
      DEV_MODE: ${DEV_MODE:-0}
      TZ: ${TZ:-Europe/Prague}
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Remove in production once cloudflared is the only path in.
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  worker:
    build:
      context: ../api
      dockerfile: Dockerfile
    command: ["python", "-m", "app.scheduler.main"]
    environment:
      DATABASE_URL: postgresql+psycopg://mikos:${POSTGRES_PASSWORD:-mikos}@db:5432/mikos
      TZ: ${TZ:-Europe/Prague}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Enable in M3 when Cloudflare Tunnel is configured.
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   command: tunnel --no-autoupdate run
  #   environment:
  #     TUNNEL_TOKEN: ${CLOUDFLARED_TOKEN}
  #   depends_on:
  #     - api
  #   restart: unless-stopped

volumes:
  pgdata:
